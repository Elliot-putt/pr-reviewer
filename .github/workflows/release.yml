name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 '__version__' src/prreviewer/version.py | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version in source: $VERSION"

      - name: Create release if tag is new
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — bump __version__ in src/prreviewer/version.py to publish a new one."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Draft first — the app's update check ignores drafts, so the release
          # only becomes visible once the Mac build has attached its assets.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --draft
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Drafted $TAG"

  build-mac-app:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build .app
        run: |
          uv sync
          uv run --with pyinstaller pyinstaller pr-reviewer.spec --noconfirm

      - name: Package DMG (drag-to-Applications)
        run: |
          brew install create-dmg
          mkdir dmg
          cp -R "dist/PR Reviewer.app" dmg/
          # create-dmg / hdiutil is flaky on runners — retry a few times
          for i in 1 2 3 4; do
            create-dmg \
              --volname "PR Reviewer" \
              --volicon build_res/icon.icns \
              --background build_res/dmg-bg.png \
              --window-pos 200 160 \
              --window-size 560 360 \
              --icon-size 128 \
              --icon "PR Reviewer.app" 140 170 \
              --app-drop-link 420 170 \
              --hide-extension "PR Reviewer.app" \
              --no-internet-enable \
              "PR-Reviewer-$VERSION.dmg" dmg/ && break
            echo "create-dmg attempt $i failed; retrying"
            sleep 5
          done
          test -f "PR-Reviewer-$VERSION.dmg"
          cd dist && zip -qry "../PR-Reviewer-$VERSION.zip" "PR Reviewer.app"

      - name: Attach to release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" \
            "PR-Reviewer-$VERSION.dmg" \
            "PR-Reviewer-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY"
          # Assets are attached — now make the release public so apps see it
          gh release edit "v$VERSION" --draft=false --repo "$GITHUB_REPOSITORY"
