name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 '__version__' src/prreviewer/version.py | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version in source: $VERSION"

      - name: Create release if tag is new
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — bump __version__ in src/prreviewer/version.py to publish a new one."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Published $TAG"

  build-mac-app:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build .app
        run: |
          uv sync
          uv run --with pyinstaller pyinstaller pr-reviewer.spec --noconfirm

      - name: Package DMG (drag-to-Applications)
        run: |
          mkdir dmg
          cp -R "dist/PR Reviewer.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "PR Reviewer" -srcfolder dmg -ov -format UDZO "PR-Reviewer-$VERSION.dmg"
          cd dist && zip -qry "../PR-Reviewer-$VERSION.zip" "PR Reviewer.app"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$VERSION" \
            "PR-Reviewer-$VERSION.dmg" \
            "PR-Reviewer-$VERSION.zip" \
            --repo "$GITHUB_REPOSITORY"
