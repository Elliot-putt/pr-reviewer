[project]
name = "pr-reviewer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5.0",
    "ptyprocess",
    "websockets>=12.0",
    "slack-bolt",
    "PyGithub",
    "pydantic>=2.0",
    "pydantic-settings",
    "httpx",
]

[dependency-groups]
dev = ["ruff", "mypy"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prreviewer"]
