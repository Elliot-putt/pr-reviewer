  <!-- xterm.js terminal lifecycle -->
  <script>
  window.__xtermInstances = {};

  window.__mountXterm = function(containerId, prId, wsPort) {
    if (window.__xtermInstances[prId]) return;
    var container = document.getElementById(containerId);
    if (!container) return;
    var XTermClass = window.__XTerm;
    var XFitAddon = window.__XFitAddon;
    if (!XTermClass || !XFitAddon) return;
    var term = new XTermClass({ cursorBlink: true, fontSize: 13,
      fontFamily: '"JetBrains Mono","Fira Code",monospace',
      theme: { background:'#0d0f14', foreground:'#e2e8f0', cursor:'#7dd3fc', selectionBackground:'#5359EA44' },
      convertEol: true });
    var fitAddon = new XFitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(container);
    setTimeout(function() {
      fitAddon.fit();
      var ws = new WebSocket('ws://127.0.0.1:' + wsPort + '/terminal/' + prId);
      ws.onopen = function() { fitAddon.fit(); ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows})); };
      ws.onmessage = function(ev) { try { var m=JSON.parse(ev.data); if(m.type==='data'){ var b=atob(m.data),u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); term.write(u); } } catch(e){} };
      ws.onerror = function() { term.write('\r\n\x1b[31m[Connection error]\x1b[0m\r\n'); };
      ws.onclose = function() { term.write('\r\n\x1b[90m[Session closed]\x1b[0m\r\n'); };
      term.onData(function(d) { if(ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:'input',data:btoa(d)})); });
      var ro = new ResizeObserver(function() { try { fitAddon.fit(); if(ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows})); } catch(e){} });
      ro.observe(container);
      window.__xtermInstances[prId] = { term: term, ws: ws, ro: ro };
    }, 150);
  };

  window.__destroyXterm = function(prId) {
    var inst = window.__xtermInstances[prId];
    if (!inst) return;
    inst.ro.disconnect(); inst.ws.close(); inst.term.dispose();
    delete window.__xtermInstances[prId];
  };
  </script>

  <!-- Python bridge integration -->
  <script>
  // ---------------------------------------------------------------------------
  // Python API bridge helpers (safe no-ops when pywebview is absent)
  // ---------------------------------------------------------------------------
  window.__pyApi = {
    startReview: function(prId) {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.start_review(prId);
      }
      return Promise.resolve({ ok: false, error: 'pywebview not available' });
    },
    postReview: function(prId, commentIds, decision) {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.post_review(prId, commentIds, decision);
      }
      return Promise.resolve({ ok: false, error: 'pywebview not available' });
    },
    approvePr: function(prId) {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.approve_pr(prId);
      }
      return Promise.resolve({ ok: false, error: 'pywebview not available' });
    },
    markReviewed: function(prId) {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.mark_reviewed(prId);
      }
      return Promise.resolve({ ok: false, error: 'pywebview not available' });
    },
    getPrs: function() {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.get_prs();
      }
      return Promise.resolve([]);
    },
    getSettings: function() {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.get_settings();
      }
      return Promise.resolve({ slackConnected: false, githubConnected: false, wsPort: 8766, isConfigured: false });
    },
    saveSettings: function(data) {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.save_settings(data);
      }
      return Promise.resolve({ ok: false });
    },
    checkUpdates: function() {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.check_updates();
      }
      return Promise.resolve({ ok: false });
    },
    listSlackChannels: function() {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.list_slack_channels();
      }
      return Promise.resolve({ ok: false, error: 'pywebview not available' });
    },
    pickFolder: function(initial) {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.pick_folder(initial || "");
      }
      return Promise.resolve({ ok: false, error: 'pywebview not available' });
    },
    connectSlack: function() {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.connect_slack();
      }
      return Promise.resolve({ ok: false, error: 'pywebview not available' });
    },
    disconnectSlack: function() {
      if (window.pywebview && window.pywebview.api) {
        return window.pywebview.api.disconnect_slack();
      }
      return Promise.resolve({ ok: true });
    },
  };

  // Forward Python-pushed events into the app
  ['settings-updated', 'backfill-start', 'backfill-done'].forEach(name => {
    window.addEventListener(name, (e) => {
      window.__appEventBus && window.__appEventBus.dispatchEvent(
        new CustomEvent(name, { detail: e.detail })
      );
    });
  });

  // ---------------------------------------------------------------------------
  // App-level event bridge: Python → React
  // Dispatched by Python via window.dispatchEvent(new CustomEvent(...))
  // ---------------------------------------------------------------------------
  window.__appEventBus = new EventTarget();

  window.addEventListener('pr-detected', (e) => {
    window.__appEventBus.dispatchEvent(new CustomEvent('pr-detected', { detail: e.detail }));
  });

  window.addEventListener('pr-updated', (e) => {
    window.__appEventBus.dispatchEvent(new CustomEvent('pr-updated', { detail: e.detail }));
  });
  </script>
